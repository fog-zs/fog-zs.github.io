    consensusText: 用于P2P网状网络的复制状态机，可信节点之间用Raft，包含不可信节点时用HotStuff。用Rust编写，核心支持原生平台和wasm32，采用MPL-2.0许可，目前是实验性实现，尚未经过安全审计。
    mistaiText: 用于共享HTTP模型连接和P2P AI房间的TypeScript库，聊天、TTS、STT和OpenAI兼容HTTP隧道共用一个注入的传输层。Preact设置界面可以选用，采用MPL-2.0许可。
