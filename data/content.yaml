    projects:
      - id: mistlib
        number: "01"
        kind: P2P / RUST
        name: mistlib
        subtitle: A P2P networking library for the web and native apps, without Unity
        badge: In development
        purpose: A P2P networking library for sharing information with nearby peers in virtual spaces. It replaces MistNet, which only worked in Unity, and can be used from web apps or as a DLL.
        role: I build and test the Rust core, native library and WebAssembly build together with AI coding tools.
        design: It selects nearby peers and peers in each direction by position and area of interest (AOI). Messages to peers without a direct connection are relayed through the participant network.
        output: Written in Rust, using WebRTC DataChannel for communication. The native library, browser WebAssembly build and npm package @tik-choco/mistlib are available under MPL-2.0.
        status: It uses Nostr relays and STUN, with TURN when needed. The default connection budget is 30 per node; this does not set a total participant limit or guarantee performance.
        sourceKey: mistlib
        roleKey: mistlibRole
      - id: linkai
        number: "03"
        kind: GAME / WORLD
        name: Linkai Online
        subtitle: 零界オンライン
        badge: In development
        purpose: A block sandbox where you can build, craft and create spells in a forest. I first built it in Unity and am now remaking it as a web game.
        role: I design the game and write almost all of its code, in both the Unity and web versions.
        design: The world is a dense, seed-generated 1 km × 1 km forest with building using blocks, lines, walls, floors and blueprints, plus crafting, magic devices, night monsters and blight areas. Spells are node graphs combining element, shape, behavior and condition; an LLM can generate them too.
        output: The web version uses Preact, Vite, TypeScript and three.js, has English, Japanese and Chinese UI, and runs in the browser without a launcher. The official site introduces the game. The launcher version on BOOTH is the earlier Unity version.
        status: The web remake is in progress. It has mistlib P2P co-op, rooms joined by link or code, party voice chat and screen sharing, and VRM avatars, and needs no dedicated game server. I've stopped developing the Unity version.
        sourceKey: linkai
        secondaryKey: linkaiBooth
        playKey: linkaiPlay
      - id: mistl
        number: "04"
        kind: P2P / CLI
        name: MISTL
        subtitle: A CLI for tik-choco features
        badge: In development
        purpose: A Rust daemon CLI that runs on mistlib and packages tik-choco features in one binary.
        role: I design it and implement it in Rust together with AI coding tools.
        design: It provides tc-storage-compatible did:key (Ed25519) identity and content-addressed storage, a screen-sharing RTSP server playable by VRChat's AVPro player, and a tc-chat relay that keeps chat running without an open browser tab. P2P port forwarding over the mist network supports per-connection approval, a trust store and an audit log; a mistai-compatible P2P AI network is also supported.
        output: The mistl CLI has a built-in English/Japanese web dashboard at http://127.0.0.1:6480/ and is distributed on Windows as a standalone mistl.exe. Source and releases are on GitHub under MPL-2.0.
        status: In development. New versions are published on the GitHub releases page.
        sourceKey: mistl
        secondaryKey: mistlReleases
