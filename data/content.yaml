        number: "01"
        kind: P2P / RUST
        name: mistlib
        subtitle: Unityに依存しない、Web・ネイティブ両対応のP2P通信ライブラリ
        badge: 開発中
        purpose: 仮想空間で近くの相手と情報を共有するP2P通信ライブラリです。Unity専用だったMistNetを置き換え、WebアプリからもDLLとしても使えるようにしました。
        role: AIコーディングツールと一緒に、Rustコアとネイティブ版、WebAssembly版の実装・テストを進めています。
        design: 位置とAOI（周囲の関心領域）から、近傍と各方向の接続相手を選びます。直接つながっていない相手へのメッセージは、参加者の接続網で中継します。
        output: Rust製で、通信にはWebRTC DataChannelを使います。ネイティブライブラリとブラウザ用WebAssembly、npm @tik-choco/mistlibをMPL-2.0で公開しています。
        status: NostrリレーとSTUNを使い、必要に応じてTURNも使います。既定の接続予算は各ノード30で、全体の参加人数の上限や性能保証ではありません。
        sourceKey: mistlib
        roleKey: mistlibRole
      - id: linkai
        number: "03"
        kind: GAME / WORLD
        name: 零界オンライン
        subtitle: Linkai Online
        badge: 開発中
        purpose: 森で建築やクラフト、魔法づくりができるブロックサンドボックスです。もともとUnityで作っていましたが、Webゲームとして作り直しています。
        role: Unity版・Web版とも、ゲームの設計とプログラムのほぼすべてを担当しています。
        design: 舞台はシードから生成する1 km × 1 kmの密な森で、ブロック・線・壁・床・設計図による建築、クラフト、魔法装置、夜のモンスター、「blight」エリアを実装しています。魔法は元素・形状・振る舞い・条件を組み合わせるノードグラフで、LLMでも生成できます。
        output: Web版はPreact・Vite・TypeScript・three.js製で、UIは英語・日本語・中国語に対応し、ランチャーなしでブラウザから遊べます。公式サイトで紹介しています。BOOTHで配布しているランチャー版は、以前のUnity版です。
        status: Web版を作り直している途中です。mistlibによるP2P協力プレイ、リンクやコードでのルーム参加、パーティーのボイスチャット・画面共有、VRMアバターに対応しています。専用ゲームサーバーは不要です。Unity版の開発はやめています。
        sourceKey: linkai
        secondaryKey: linkaiBooth
        playKey: linkaiPlay
      - id: mistl
        number: "04"
        kind: P2P / CLI
        name: MISTL
        subtitle: tik-chocoの機能をまとめたCLI
        badge: 開発中
        purpose: tik-chocoの各種機能を1つのバイナリにまとめた、mistlib上で動くRust製デーモンCLIです。
        role: 設計を考え、AIコーディングツールと一緒にRustで実装しています。
        design: tc-storage互換のdid:key（Ed25519）IDとコンテンツアドレス方式のストレージ、VRChatのAVProプレイヤーで再生できる画面共有RTSPサーバー、ブラウザのタブを開かずにチャットを続けるtc-chatリレーを備えています。mistネットワーク経由のP2Pポート転送は接続ごとの承認・トラストストア・監査ログに対応し、mistai互換のP2P AIネットワークも使えます。
        output: Windows版は単体で動くmistl.exeとして配布し、コマンドはmistl、内蔵Webダッシュボードは英語・日本語対応でhttp://127.0.0.1:6480/から使えます。ソースコードとリリースはGitHub、ライセンスはMPL-2.0です。
        status: 開発中です。新しい版はGitHubのリリースページで公開しています。
        sourceKey: mistl
        secondaryKey: mistlReleases
