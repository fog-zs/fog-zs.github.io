    consensusText: Replicated state machines for P2P meshes, using Raft for trusted peers and HotStuff when the network includes untrusted peers. Written in Rust with native and wasm32 core support under MPL-2.0; the implementation is experimental and has not had a security audit.
    mistaiText: A TypeScript library for sharing HTTP model connections and running P2P AI rooms, with chat, TTS, STT and an OpenAI-compatible HTTP tunnel sharing one injected transport. A Preact settings UI is optional; the license is MPL-2.0.
